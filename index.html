                                <div className="aspect-video bg-black">
                                     <iframe className="w-full h-full" src="https://www.youtube.com/embed/Hz2O4ftt0E8" title="Tutorial Creator Studio" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
                                </div>
                                <div className="bg-indigo-900/80 p-2 text-center backdrop-blur-md">
                                    <p className="text-white text-[10px] font-bold uppercase tracking-widest">✨ Descubre la Magia</p>
                                </div>
                            </div>

                            <h2 className="text-4xl font-bold font-dosis mb-2">Tu Imaginación no tiene límites</h2>
                            <p className="text-lg opacity-90 font-outfit mb-8">Crea, diseña y comparte.</p>

                            {/* BOTÓN NUEVO PARA VER LA BIBLIOTECA */}
                            <button 
                                onClick={() => setShowGallery(true)}
                                className="bg-white/20 hover:bg-white/30 backdrop-blur-md border border-white/40 text-white font-bold py-3 px-6 rounded-full w-max flex items-center gap-3 transition-all hover:scale-105 shadow-lg group"
                            >
                                <span className="bg-white text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center shadow-md group-hover:rotate-12 transition">
                                    <i className="fas fa-book-open"></i>
                                </span>
                                Explorar Biblioteca Pública
                            </button>
                        </div>

                    </div>
                    <div className="login-form-side">
                        <div className="w-full max-w-md">

                                <form onSubmit={handleReset} className="space-y-4">
                                    <input className="input-field-clean" placeholder="Tu correo" value={email} onChange={e=>setEmail(e.target.value)} />
                                    <button className="btn-modern bg-gradient-primary w-full py-3 text-lg">Enviar Enlace</button>
                                    <div onClick={()=>setIsReset(false)} className="text-center text-gray-500 text-sm cursor-pointer hover:text-indigo-500 mt-4 font-bold">Cancelar</div>
                                </form>
                            ) : (
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <input className="input-field-clean" placeholder="Correo" value={email} onChange={e=>setEmail(e.target.value)} />
                                    <input className="input-field-clean" type="password" placeholder="Contraseña" value={password} onChange={e=>setPassword(e.target.value)} />

                                    <div className="relative flex py-2 items-center"><div className="flex-grow border-t border-gray-200"></div><span className="flex-shrink-0 mx-4 text-gray-400 text-xs">O continúa con</span><div className="flex-grow border-t border-gray-200"></div></div>
                                    <button type="button" onClick={handleGoogleLogin} className="btn-modern bg-white text-gray-700 w-full py-3 text-lg border border-gray-200 hover:bg-gray-50"><i className="fab fa-google text-red-500 mr-2"></i> Google</button>
                                    <div className="mt-6 text-center"><span className="text-sm text-indigo-600 cursor-pointer hover:text-indigo-800 font-bold border-b-2 border-indigo-100 hover:border-indigo-600 transition" onClick={()=>setIsRegister(!isRegister)}>{isRegister ? '¿Ya tienes cuenta? Inicia Sesión' : '¿Eres nuevo? Regístrate aquí'}</span></div>
                                </form>
                            )}

        // --- PUBLIC GALLERY (EXISTENTE) ---
        function PublicGallery({ uid, isEmbedded }) {

            const [storyboardNotes, setStoryboardNotes] = useState([]);
            const [activeTab, setActiveTab] = useState('book'); 

            useEffect(() => {
                if(!db) return;
                const load = async () => {
                    const docSnap = await getDoc(doc(db, 'artifacts', 'libroalbum-app', 'portfolios', uid));
                    if(docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.publishedBook) { setBook(data.publishedBook); }
                    }
                    const profileSnap = await getDoc(doc(db, 'artifacts', 'libroalbum-app', 'users', uid, 'profile', 'user_info'));
                    if(profileSnap.exists()) setUserProfile(profileSnap.data());
                    
                    try {
                        const mbSnap = await getDoc(doc(db, 'artifacts', 'libroalbum-app', 'users', uid, 'moodboards', 'main'));
                        if (mbSnap.exists()) setMoodboardItems(mbSnap.data().items || []);
                    } catch (e) {}

                    setLoading(false);

                        <div style={{ position: 'relative', width: '95%', height: '90%', maxWidth: '1600px', backgroundColor: '#2196F3', backgroundImage: 'linear-gradient(90deg, #F44336 25%, #FFEB3B 25%, #FFEB3B 50%, #2196F3 50%, #2196F3 75%, #4CAF50 75%)', backgroundSize: '100px 100%', display: 'flex', flexDirection: 'column', padding: '60px', paddingTop: '0', boxShadow: '0 30px 60px rgba(0,0,0,0.6)', borderRadius: '20px' }}>
                            <div style={{ backgroundColor: '#F44336', width: 'calc(100% + 120px)', marginLeft: '-60px', height: '80px', display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: '5px solid rgba(0,0,0,0.1)', position: 'relative', zIndex: 10, borderRadius: '20px 20px 0 0' }}>

                                {items && items.map((item, i) => (
                                    <div key={i} style={{ position: 'absolute', left: item.left, top: item.top, transform: item.transform, zIndex: item.zIndex, width: item.width || 'auto', height: item.height || 'auto', padding: '10px', display: 'inline-block' }}>
                                        <div style={{ backgroundColor: item.type === 'text' ? 'rgba(255,255,255,0.9)' : 'white', padding: '10px', boxShadow: '0 4px 10px rgba(0,0,0,0.2)', borderRadius: '4px', border: '1px solid #eee' }}>
                                            {item.type === 'text' ? <div style={{fontFamily: "'Permanent Marker', cursive", fontSize: '1.5rem', color: '#333', textAlign:'center'}}>{item.content}</div> : <img src={item.content} style={{width:'100%', height:'100%', objectFit:'cover', display:'block'}}/>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const ReadOnlyStoryboard = ({ notes }) => (
                <div className="w-full h-full overflow-y-auto p-8 relative">
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, 240px)', gridAutoRows: '250px', gap: '25px', justifyContent: 'center', width: '100%', paddingBottom: '50px' }}>
                        {notes && notes.map((note, i) => (
                            <div key={i} className="note" style={{backgroundColor: note.color, cursor: 'default'}}>
                                <div className="note-header"><label className="page-toggle" style={{pointerEvents:'none'}}><input type="checkbox" checked={note.isDouble} readOnly/> Doble Pág.</label><div className="scene-badge"># {note.sceneNum || i+1}</div></div>
                                <div className="note-body"><div className="field-label"><i className="fa-solid fa-video"></i> Descripción</div><div className="editable-area" style={{background:'rgba(255,255,255,0.4)', padding:'6px', borderRadius:'8px', fontSize:'0.8rem', minHeight:'50px', marginBottom:'8px'}}>{note.sceneText || note.scene}</div><div className="field-label"><i className="fa-solid fa-comments"></i> Diálogo</div><div className="editable-area" style={{background:'rgba(255,255,255,0.4)', padding:'6px', borderRadius:'8px', fontSize:'0.8rem', minHeight:'50px', fontStyle:'italic'}}>{note.dialogText || note.dialog}</div></div>
                            </div>

            const publicUrl = `${window.location.origin}${window.location.pathname}?portfolio=${uid}`;

            return (

        // --- PUBLIC ACTIVITY VIEWER ---
        function PublicActivityViewer({ activity }) {
            const [showGuide, setShowGuide] = useState(true);
            const [showBlocker, setShowBlocker] = useState(false);
            const RegistrationBubble = ({ onClose }) => (<div className="fixed top-20 right-5 z-[9999] w-72 bg-white p-5 rounded-2xl shadow-xl border-2 border-indigo-500 animate-bounce-in"><button onClick={onClose} className="absolute top-2 left-2 text-gray-400 hover:text-red-500"><i className="fas fa-times"></i></button><h3 className="font-bold text-indigo-600 mb-2">¡Hola, Creador!</h3><p className="text-sm text-gray-600 mb-3">Estás viendo una actividad pública. Regístrate para guardar tu progreso.</p><button onClick={()=>window.location.href=window.location.pathname} className="btn-modern bg-gradient-primary w-full text-xs py-2">CREAR CUENTA</button></div>);

            let content;
            switch(activity) {
                case 'padlet': content = <ActivityIntro title="Muro Colaborativo" text="¡Comparte con la clase! Agrega 2 o 3 etiquetas sobre mitos y leyendas de Norte de Santander que te gusten, añade un breve resumen y, si puedes, una foto."><iframe src="https://padlet.com/embed/kz78sfkwdm9abosj" className="w-full h-full border-none"></iframe></ActivityIntro>; break;
                case 'quiz': content = <ActivityIntro title="¿Cuánto Aprendiste?" text="Es hora de poner a prueba tus conocimientos. Responderás preguntas sobre conceptos del Libro Álbum y los Mitos y Leyendas que hemos explorado."><div className="w-full h-full flex flex-col items-center justify-center bg-yellow-50 relative overflow-hidden"><div className="absolute inset-0 bg-yellow-900/10"></div><div className="relative z-10 text-center p-10 bg-white rounded-3xl shadow-2xl max-w-lg"><h1 className="text-4xl font-black text-yellow-500 mb-4">Quiz Time!</h1><p className="text-gray-500 mb-8">Demuestra tus conocimientos sobre mitos y leyendas.</p><a href="https://create.kahoot.it/share/quiz-interactivo/f8f5983d-25e9-44e7-aa46-eab37837811f" target="_blank" className="btn-modern bg-gradient-activity text-xl px-8 py-3">INICIAR</a></div></div></ActivityIntro>; break;
                case 'guia': content = <iframe src="https://libroalbum.github.io/libro-lbum-pedag-gico/" className="w-full h-full border-none"></iframe>; break;
                case 'moodboard': content = <ActivityIntro title="¡Bienvenido a tu Moodboard!" text={<>Este es tu lienzo infinito de inspiración. Aquí podrás reunir imágenes, textos y colores para dar vida a la atmósfera de tu historia.<br/><br/><strong>¡Tip Mágico!</strong> ✨ Copia imágenes de internet y pégalas (Ctrl+V) directamente.</>}><div className="w-full h-full relative">{showBlocker && <BlockerModal />}<MoodboardComponent user={null} /><div className="absolute inset-0 z-[9000] cursor-pointer" onClick={() => setShowBlocker(true)} title="Registrarse para editar"></div></div></ActivityIntro>; break;
                case 'storyboard': content = <ActivityIntro title="¡Hola, Aventurero!" text={<>Bienvenido a tu taller creativo. Aquí construirás el <strong>Storyboard</strong> para tu libro álbum digital.<br/><br/>Usa este espacio para describir <strong>cómo imaginas cada escena</strong> y escribe los <strong>diálogos</strong> de tus personajes.</>}><div className="w-full h-full relative">{showBlocker && <BlockerModal />}<StoryboardComponent user={null} /><div className="absolute inset-0 z-[9000] cursor-pointer" onClick={() => setShowBlocker(true)} title="Registrarse para editar"></div></div></ActivityIntro>; break;
                case 'ficha_narrativa': content = <ActivityIntro title="Estructura tu Historia" text="Primero, recuerda los cuentos, mitos y leyendas que investigaste. Elige el que más te guste y usa esta ficha para registrar el título, un resumen y los personajes principales."><div className="w-full h-full flex flex-col items-center justify-center bg-rose-50 relative"><div className="relative z-10 text-center p-10 bg-white rounded-3xl shadow-xl max-w-lg border border-rose-100"><h2 className="text-3xl font-bold text-rose-500 mb-4">Ficha Narrativa</h2><p className="text-gray-500 mb-6">Estructura tu historia antes de comenzar.</p><a href="https://www.canva.com/design/DAG4JQ_26mk/yYHgZbuApHUSdalSG2938g/view" target="_blank" className="btn-modern bg-gradient-activity text-lg shadow-lg">IR A CANVA</a></div></div></ActivityIntro>; break;
                case 'estructura_cuento': content = <ActivityIntro title="Estructura de Cuento" text="Aquí aprenderás a estructurar tu cuento: Introducción, Nudo y Desenlace."><div className="w-full h-full flex flex-col items-center justify-center bg-emerald-50 relative"><div className="relative z-10 text-center p-10 bg-white rounded-3xl shadow-xl max-w-lg border border-emerald-100"><h2 className="text-3xl font-bold text-emerald-500 mb-4">Estructura del Cuento</h2><p className="text-gray-500 mb-6">Define Inicio, Nudo y Desenlace.</p><a href="https://docs.google.com/forms/d/e/1FAIpQLSclddiTEQJVg2wFUoLYeJFMlAiUz0AaAqPT5s2onaiwmk5U_A/viewform" target="_blank" className="btn-modern bg-gradient-success text-lg shadow-lg">ABRIR FORMULARIO</a></div></div></ActivityIntro>; break;
                case 'ficha_personajes': content = <ActivityIntro title="Taller de Personajes" text="Aquí construirás a los protagonistas de tu historia. Define cómo se imaginan físicamente, cómo son emocionalmente y qué ropa llevan."><div className="w-full h-full flex flex-col items-center justify-center bg-indigo-50 relative"><div className="relative z-10 text-center p-10 bg-white rounded-3xl shadow-xl max-w-lg border border-indigo-100"><h2 className="text-3xl font-bold text-indigo-500 mb-4">Taller de Personajes</h2><p className="text-gray-500 mb-6">Crea la personalidad y apariencia de tus héroes.</p><a href="https://docs.google.com/forms/d/e/1FAIpQLSdeATljdt5PMVoLzJ1x6S7sItasYY9hW2aiClLJpE1Yr1OyQw/viewform" target="_blank" className="btn-modern bg-gradient-primary text-lg shadow-lg">ABRIR FICHA</a></div></div></ActivityIntro>; break;

                    {showGuide && <RegistrationBubble onClose={()=>setShowGuide(false)} />}
                    <div className="h-16 bg-white border-b flex items-center justify-between px-6 shadow-sm z-50">
                        <div className="font-bold text-xl text-indigo-600">CREATOR STUDIO <span className="text-gray-400 font-normal text-sm">/ Vista Pública</span></div>
                        <button onClick={()=>window.location.href=window.location.pathname} className="btn-modern bg-gradient-primary text-xs px-4">ACCEDER</button>
                    </div>
                    <div className="flex-1 relative overflow-hidden">{content}</div>
                </div>
            );
        }

        // --- DASHBOARD ---
        const Dashboard = ({ user, setView, onSelectModule }) => {
            const [userProfile, setUserProfile] = useState({ name: user.email ? user.email.split('@')[0] : 'Creador' });
            
            useEffect(() => { 
                if(!user) return; 
                const load = async () => { 
                    const snap = await getDoc(doc(db, 'artifacts', 'libroalbum-app', 'users', user.uid, 'profile', 'user_info')); 
                    if(snap.exists()) setUserProfile(snap.data()); 
                }; 
                load(); 
            }, [user]);

            return (
                <div className="flex-1 overflow-y-auto bg-[#E6ECF2] p-6 md:p-10">
                    <div className="max-w-7xl mx-auto">
                        
                        {/* --- NUEVA TARJETA DE BIENVENIDA (AJUSTE SOLICITADO) --- */}
                        <div className="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 mb-10 fade-in flex flex-col md:flex-row items-center gap-8">
                            {/* Lado Izquierdo: Texto y Botón */}
                            <div className="flex-1">
                                <h1 className="text-3xl md:text-4xl font-display font-bold text-slate-800 mb-4">
                                    Bienvenido al Estudio, {userProfile.name}
                                </h1>
                                <p className="text-slate-600 mb-6 text-lg leading-relaxed">
                                    Este es tu espacio creativo profesional. Aquí tienes todas las herramientas para 
                                    construir, diseñar y publicar tu propio Libro Álbum Digital.
                                </p>
                                
                                <p className="text-slate-500 text-sm mb-4">
                                    Empieza revisando el video introductorio o salta directo a una misión.
                                </p>
                                
                                <button 
                                    onClick={() => setView('editor')} 
                                    className="btn-modern bg-primary py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all text-white font-bold text-lg flex items-center gap-2"
                                >
                                    <i className="fas fa-rocket"></i> Continuar mi Libro
                                </button>
                            </div>

                            {/* Lado Derecho: Video */}
                            <div className="w-full md:w-5/12">
                                <div className="aspect-video w-full rounded-2xl overflow-hidden shadow-lg bg-black border-4 border-slate-900 relative">
                                     <iframe 
                                        className="absolute inset-0 w-full h-full"
                                        src="https://www.youtube.com/embed/Hz2O4ftt0E8" 
                                        title="Video Introductorio" 
                                        frameBorder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowFullScreen
                                    ></iframe>
                                </div>
                            </div>
                        </div>
                        {/* ------------------------------------------------------- */}

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12 fade-in">
                            {MODULES_DATA.map((mod, i) => (
                                <div key={mod.id} onClick={() => onSelectModule(mod)} 
                                     className="group bg-white rounded-3xl p-6 shadow-sm border border-slate-100 cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full relative overflow-hidden">
                                    <div className={`absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${mod.color} opacity-5 rounded-bl-full group-hover:scale-110 transition`}></div>
                                    <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${mod.color} flex items-center justify-center text-white text-xl mb-6 shadow-md`}>
                                        <i className={`fas ${mod.icon}`}></i>
                                    </div>
                                    
                                    {/* AJUSTE: INVERSIÓN DE TÍTULOS */}
                                    {/* El subtítulo descriptivo ahora es el texto pequeño superior */}
                                    <h4 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">{mod.subtitle}</h4>
                                    
                                    {/* El nombre del Módulo ahora es el título grande y resaltado */}
                                    <h3 className="text-xl font-bold text-slate-800 mb-3 leading-tight group-hover:text-indigo-600 transition">Módulo 0{mod.id}</h3>
                                    
                                    <p className="text-slate-500 text-sm mb-6 flex-1 line-clamp-3">{mod.description}</p>
                                    <div className="mt-auto flex items-center text-sm font-bold text-slate-700 group-hover:text-indigo-600">
                                        Entrar <i className="fas fa-arrow-right ml-2 transition-transform group-hover:translate-x-1"></i>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null); 
            const [view, setView] = useState('loading'); 
            const [selectedModule, setSelectedModule] = useState(null);
            
            // AGREGADO: Estado global para el perfil del encabezado
            const [headerProfile, setHeaderProfile] = useState({ name: 'Creador', photo: null });
            
            // Estados para Vistas Públicas
            const [portfolioUid, setPortfolioUid] = useState(null);
            const [publicActivity, setPublicActivity] = useState(null);

            // EFECTO PARA PERSISTENCIA DE ESTADO
            useEffect(() => {
                if (view !== 'loading' && view !== 'login' && view !== 'public-view' && view !== 'public-activity') {
                    localStorage.setItem('app_view', view);
                }
                if (selectedModule) {
                    localStorage.setItem('app_module', JSON.stringify(selectedModule));
                } else if (view === 'dashboard') {
                    localStorage.removeItem('app_module');
                }
            }, [view, selectedModule]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const pUid = params.get('portfolio');
                const activityParam = params.get('activity');

                if (pUid) {
                    setPortfolioUid(pUid);
                    setView('public-view');
                } else if (activityParam) {
                    setPublicActivity(activityParam);
                    setView('public-activity');
                } else {
                    onAuthStateChanged(auth, async (u) => { 
                        setUser(u); 
                        if (u) {
                            // CARGAR PERFIL PARA EL ENCABEZADO PRINCIPAL
                            try {
                                const docSnap = await getDoc(doc(db, 'artifacts', 'libroalbum-app', 'users', u.uid, 'profile', 'user_info'));
                                if (docSnap.exists()) {
                                    setHeaderProfile(docSnap.data());
                                } else {
                                    setHeaderProfile({ 
                                        name: u.displayName || (u.email ? u.email.split('@')[0] : 'Creador'),
                                        photo: u.photoURL 
                                    });
                                }
                            } catch (e) { console.error("Error perfil header", e); }
                            
                            // RESTAURAR ESTADO PREVIO (PERSISTENCIA)
                            const savedView = localStorage.getItem('app_view');
                            const savedModule = localStorage.getItem('app_module');
                            
                            if (savedView === 'editor') {
                                setView('editor');
                            } else if (savedModule && savedModule !== 'null' && savedModule !== 'undefined') {
                                try {
                                    const savedObj = JSON.parse(savedModule);
                                    // Buscamos la versión actualizada en tu lista de datos
                                    const freshModule = MODULES_DATA.find(m => m.id === savedObj.id);
                                    
                                    if (freshModule) {
                                        // Mantenemos al usuario en la lección donde quedó
                                        if (savedObj.initialStepId) {
                                            freshModule.initialStepId = savedObj.initialStepId;
                                        }
                                        setSelectedModule(freshModule);
                                    } else {
                                        setSelectedModule(savedObj);
                                    }
                                    setView('dashboard'); 
                                } catch (e) {
                                    setView('dashboard');
                                }
                            } else {
                                setView('dashboard'); 
                            }

                        } else {
                            setView('login');
                        }
                    });
                }
            }, []);
            
            const handleSidebarShortcut = (moduleId, activityStepId) => {
                const targetModule = MODULES_DATA.find(m => m.id === moduleId);
                if (targetModule) {
                    setSelectedModule({ ...targetModule, initialStepId: activityStepId });
                }
            };

            // RENDERIZADO DE VISTAS
            if (view === 'public-view') return <PublicGallery uid={portfolioUid} />;
            if (view === 'public-activity') return <PublicActivityViewer activity={publicActivity} />;
            if (view === 'login') return <LoginScreen onLogin={() => {}} />;
            if (view === 'loading') return <div className="h-screen w-full flex items-center justify-center bg-slate-50 font-bold text-indigo-500">Cargando Studio...</div>;
            if (view === 'editor') return <Editor user={user} setView={setView} />;

            return (
                <div className="app-shell">
                    <aside className="main-sidebar">
                        <div className="sidebar-brand">
                            <i className="fas fa-layer-group"></i> CREATOR STUDIO
                        </div>
                        
                        <div className="nav-group-label">MI ESTUDIO</div>
                        <div className={`nav-item ${!selectedModule && view === 'dashboard' ? 'active' : ''}`} onClick={() => { setSelectedModule(null); setView('dashboard'); }}>
                            <div className="nav-icon-box icon-indigo"><i className="fas fa-home"></i></div>
                            <span>Inicio</span>
                        </div>
                        <div className="nav-item" onClick={() => setView('editor')}>
                            <div className="nav-icon-box icon-pink"><i className="fas fa-book-open"></i></div>
                            <span>Editar Libro</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(4, 404)}>
                            <div className="nav-icon-box icon-cyan"><i className="fas fa-briefcase"></i></div>
                            <span>Portafolio</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(4, 402)}>
                            <div className="nav-icon-box icon-emerald"><i className="fas fa-book"></i></div>
                            <span>Libro Guía</span>
                        </div>

                        <div className="nav-group-label">ACCESOS RÁPIDOS</div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(1, 104)}>
                            <div className="nav-icon-box icon-amber"><i className="fas fa-comments"></i></div>
                            <span>1. Muro Social</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(1, 105)}>
                            <div className="nav-icon-box icon-rose"><i className="fas fa-feather-alt"></i></div>
                            <span>2. Ficha Narrativa</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(1, 106)}>
                            <div className="nav-icon-box icon-violet"><i className="fas fa-puzzle-piece"></i></div>
                            <span>3. Quiz Time</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(2, 204)}>
                            <div className="nav-icon-box icon-emerald"><i className="fas fa-list-ol"></i></div>
                            <span>4. Estructura</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(2, 203)}>
                            <div className="nav-icon-box icon-amber"><i className="fas fa-layer-group"></i></div>
                            <span>5. Storyboard</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(2, 202)}>
                            <div className="nav-icon-box icon-pink"><i className="fas fa-palette"></i></div>
                            <span>6. Moodboard</span>
                        </div>
                        <div className="nav-item" onClick={() => handleSidebarShortcut(3, 307)}>
                            <div className="nav-icon-box icon-cyan"><i className="fas fa-user-tag"></i></div>
                            <span>7. Personajes</span>
                        </div>
                    </aside>
                    <main className="main-stage">
                        <header className="top-header">
                            <h2 className="text-lg font-bold text-slate-700">{selectedModule ? `Ruta de Aprendizaje / ${selectedModule.subtitle}` : 'Panel Principal'}</h2>
                            
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="text-right hidden md:block">
                                        <p className="text-sm font-bold text-slate-700 truncate max-w-[150px]">{headerProfile.name}</p>
                                        <p className="text-xs text-slate-400 uppercase">Estudiante</p>
                                    </div>
                                    <div className="w-10 h-10 rounded-full bg-gradient-primary flex items-center justify-center text-white font-bold shadow-md cursor-pointer hover:scale-105 transition overflow-hidden">
                                        {headerProfile.photo ? <img src={headerProfile.photo} className="w-full h-full object-cover" /> : (headerProfile.name[0] || 'U').toUpperCase()}
                                    </div>
                                </div>
                                <div className="h-8 w-px bg-slate-300 mx-2"></div>
                                <button onClick={()=>{ localStorage.removeItem('app_view'); localStorage.removeItem('app_module'); signOut(auth); }} className="w-9 h-9 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center hover:bg-rose-500 hover:text-white transition shadow-sm" title="Cerrar Sesión">
                                    <i className="fas fa-power-off"></i>
                                </button>
                            </div>

                        </header>
                        {selectedModule ? (<ModuleDetailView key={selectedModule.id} module={selectedModule} onBack={() => { setSelectedModule(null); setView('dashboard'); }} user={user} onBookEdit={() => setView('editor')} onSelectModule={setSelectedModule}/>) : (<Dashboard user={user} setView={setView} onSelectModule={setSelectedModule} />)}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
